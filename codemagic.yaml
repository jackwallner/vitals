workflows:
  simulator-build:
    name: Vitals simulator build only
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Generate iOS-only Xcode project
        script: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          ruby <<'RUBY'
          require "yaml"

          spec = YAML.load_file("project.yml")
          spec.fetch("schemes").fetch("Vitals").fetch("build").fetch("targets").delete("VitalsWatch")
          spec.fetch("targets").fetch("Vitals").fetch("dependencies").reject! do |dependency|
            dependency.is_a?(Hash) && dependency["target"] == "VitalsWatch"
          end
          File.write("project.ci.yml", YAML.dump(spec))
          RUBY
          xcodegen generate --spec project.ci.yml
      - name: Build unsigned iOS simulator app
        script: |
          set -euo pipefail
          mkdir -p /tmp/xcodebuild_logs
          xcodebuild build \
            -project "Vitals.xcodeproj" \
            -scheme "Vitals" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcodebuild_logs/vitals.log
    artifacts:
      - /tmp/xcodebuild_logs/*.log
      - $CM_BUILD_DIR/build/Build/Products/**/*.app
      - $CM_BUILD_DIR/build/Build/Products/**/*.dSYM
