name: Vitals
options:
  bundleIdPrefix: com.jackwallner
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YXG4MP6W39
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.7.3"
    CURRENT_PROJECT_VERSION: "126"
    GENERATE_INFOPLIST_FILE: NO

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.14.0

schemes:
  Vitals:
    build:
      targets:
        Vitals: all
        VitalsWatch: all
        VitalsTests: [test]
    test:
      targets:
        - VitalsTests
    run:
      config: Debug
  VitalsWatch:
    build:
      targets:
        VitalsWatch: all
    run:
      config: Debug

targets:
  Vitals:
    type: application
    platform: iOS
    sources:
      - path: Vitals
      - path: Shared
      - path: Vitals.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.vitals
        INFOPLIST_FILE: Vitals/Info.plist
        CODE_SIGN_ENTITLEMENTS: Vitals/Vitals.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - target: VitalsWidget
      - target: VitalsWatch
        embed: true

  VitalsWatch:
    type: application
    platform: watchOS
    sources:
      - path: VitalsWatch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.vitals.watch
        INFOPLIST_FILE: VitalsWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: VitalsWatch/VitalsWatch.entitlements
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - target: VitalsWatchWidget

  VitalsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: VitalsWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.vitals.widget
        INFOPLIST_FILE: VitalsWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: VitalsWidget/VitalsWidget.entitlements
    dependencies:
      - package: RevenueCat
        product: RevenueCat

  VitalsWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: VitalsWatchWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.vitals.watch.widget
        INFOPLIST_FILE: VitalsWatchWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: VitalsWatchWidget/VitalsWatchWidget.entitlements
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
    dependencies:
      - package: RevenueCat
        product: RevenueCat

  VitalsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VitalsTests
      - path: Shared/Models/CalorieTrendSummary.swift
      - path: Shared/Utilities/ProjectionCalculator.swift
      - path: Shared/Utilities/WeeklyRecap.swift
      - path: Shared/Utilities/MilestoneCalculator.swift
      - path: Shared/Utilities/BodyProfileCalculator.swift
      - path: Shared/Models/BodyProfile.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.vitals.tests
